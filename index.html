/* ============================================================
   JurisFlow UI refresh · v0.2
   Visual layer only: preserves the MVP data model and behavior.
   ============================================================ */
:root{
  --ink:#172033;
  --muted:#758094;
  --green:#152238;
  --green-light:#eef2f7;
  --accent:#c6a46b;
  --accent-strong:#a9844d;
  --paper:#f4f6f9;
  --line:#e3e8ef;
  --red:#b54e51;
  --red-light:#fff0f0;
  --amber:#9b702f;
  --white:#fff;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.04);
  --shadow-md:0 10px 30px rgba(15,23,42,.07);
  --shadow-lg:0 24px 70px rgba(15,23,42,.14);
}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-size:14px}
h1,h2,h3{color:var(--ink)}
h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-1.5px}
p{color:var(--muted)}
button{transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease,color .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(198,164,107,.34);outline-offset:2px}

/* Shell */
.sidebar{
  width:258px;
  padding:28px 18px 18px;
  background:linear-gradient(180deg,#101928 0%,#132033 64%,#0f1927 100%);
  border-right:1px solid rgba(255,255,255,.04);
  box-shadow:14px 0 40px rgba(15,23,42,.06);
}
.main-shell{margin-left:258px}
.brand{padding:0 12px 24px;color:#fff;font-size:25px;letter-spacing:-.6px}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(145deg,#d5b77f,#a8864f);
  border:1px solid rgba(255,255,255,.15);
  color:#111b2b;font-size:29px;font-weight:700;font-style:normal;
  box-shadow:0 7px 20px rgba(0,0,0,.18)
}
.brand small{font-size:8px;letter-spacing:2px;color:#8591a3;margin-top:5px}
.workspace-tag{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.08);padding:12px 13px;border-radius:10px;color:#e8edf4}
.workspace-tag small{color:#8d98a8}.workspace-dot{background:#d1b47e;box-shadow:0 0 0 4px rgba(209,180,126,.10)}
.nav-label{font-size:9px;letter-spacing:1.65px;color:#657187;padding:25px 12px 10px}
.sidebar nav{gap:4px}
.nav-item{border-radius:10px;padding:11px 12px;color:#9eabba;font-size:12px;font-weight:500}
.nav-item svg{opacity:.82}.nav-item:hover{background:rgba(255,255,255,.055);color:#f7f9fc}
.nav-item.active{background:linear-gradient(90deg,rgba(198,164,107,.18),rgba(198,164,107,.08));color:#f7ead1;box-shadow:inset 3px 0 0 #c6a46b}
.nav-item.active svg{color:#d6b77e;opacity:1}.nav-item b{background:#b84f51;border-radius:999px;min-width:20px;text-align:center;padding:3px 6px}
.sidebar-note{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.07);border-radius:12px;color:#cfd8e3;padding:17px 16px}
.sidebar-note>svg{color:#c6a46b}.sidebar-note strong{font-size:11px;color:#eff3f8}.sidebar-note p{font-size:10px;color:#8290a2}.sidebar-note button{color:#d3b67f}
.sidebar-user{border-color:rgba(255,255,255,.08)}.sidebar-user strong{color:#f2f5f8}.sidebar-user small{color:#7f8b9d}
.sidebar-user .avatar{background:#273750;color:#ebd6b3}.sidebar-user .icon-button{color:#aeb9c5}

.topbar{
  position:sticky;top:0;z-index:9;
  min-height:76px;padding:16px 36px;
  background:rgba(250,251,253,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(224,229,237,.9)
}
.breadcrumb{font-size:11px;color:#8b95a4}.breadcrumb strong{color:#354056;font-weight:600}.breadcrumb span{color:#c2c9d3}
.topbar-right{gap:16px}.top-date{font-size:10px;color:#8a94a4}
.searchbox{max-width:330px;background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:9px 12px;color:#8e98a7;box-shadow:var(--shadow-sm)}
.searchbox input{width:215px;font-size:11px;color:#293548}.searchbox input::placeholder{color:#a5afbc}
.avatar{background:#edf1f6;color:#46546b;border:1px solid #e0e6ee;font-weight:700}
.demo-banner{padding:8px 36px;background:#fbf7ee;border-bottom:1px solid #eee3cd;color:#77674e}.demo-pill{background:#fff9ec;border-color:#c9a66a;color:#8b6731;border-radius:999px;padding:4px 8px}.demo-controls select{background:#fff;border-color:#dfd3ba;color:#574b3c;border-radius:7px;padding:5px 8px}.demo-controls button{color:#8b6731}
main{max-width:1680px;padding:34px 36px 0}

/* Shared surfaces */
.panel{border:1px solid #e1e7ee;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm)}
.eyebrow{font-size:9px;letter-spacing:1.7px;color:#9a7a47;font-weight:700}
.primary,.secondary{border-radius:9px;min-height:40px;padding:10px 15px;font-size:11px;font-weight:600}
.primary{background:#17263b;border-color:#17263b;color:#fff;box-shadow:0 4px 12px rgba(23,38,59,.14)}
.primary:hover:not(:disabled){background:#213552;border-color:#213552;transform:translateY(-1px);box-shadow:0 7px 18px rgba(23,38,59,.18)}
.secondary{background:#fff;border-color:#d9e0e8;color:#3d4a5e;box-shadow:var(--shadow-sm)}
.secondary:hover:not(:disabled){background:#f8fafc;border-color:#cbd4df;transform:translateY(-1px)}
.text-button{color:#7e643a;font-size:11px;font-weight:600}.text-button:hover{color:#5f4b2b}
.icon-button{border-radius:8px;color:#778397}.icon-button:hover:not(:disabled){background:#f1f4f8;color:#344156}

/* Dashboard */
.welcome{
  min-height:300px;margin-bottom:22px;padding:38px 42px;
  border:1px solid #1e3049;border-radius:18px;
  background:
    radial-gradient(circle at 82% 18%,rgba(207,174,116,.20),transparent 26%),
    radial-gradient(circle at 90% 82%,rgba(103,128,159,.16),transparent 31%),
    linear-gradient(125deg,#101b2b 0%,#172a43 58%,#1a304b 100%);
  box-shadow:0 18px 45px rgba(15,23,42,.14);
}
.welcome:after{content:"";position:absolute;right:-60px;bottom:-115px;width:330px;height:330px;border:1px solid rgba(214,183,126,.13);border-radius:50%;box-shadow:0 0 0 48px rgba(214,183,126,.035),0 0 0 96px rgba(214,183,126,.022);pointer-events:none}
.welcome .eyebrow{color:#d5b67e}.welcome h1{color:#fff;font-size:49px;letter-spacing:-2px}.welcome h1 em{color:#d7bd8c}.welcome p{color:#9eacbd;font-size:12px}
.welcome .primary{background:#d1af74;border-color:#d1af74;color:#132035;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.welcome .primary:hover:not(:disabled){background:#ddbf89;border-color:#ddbf89}
.welcome .text-button{color:#d8e0ea}.welcome .text-button:hover{color:#fff}
.welcome-panel{max-width:300px;flex-basis:300px;border-left:1px solid rgba(255,255,255,.11);padding-left:36px;position:relative;z-index:1}
.welcome-panel h2{color:#f3f5f8;font-size:23px;font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.35}.welcome-panel p{color:#91a0b1}.welcome-panel .eyebrow{color:#b89a67}.subtle-tag{color:#a9b6c5}.circle-icon{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.10);color:#d3b276;width:67px;height:67px}
.metrics{gap:16px;margin-bottom:23px}.metric{position:relative;border-radius:14px;padding:22px 24px 19px;border-color:#e1e6ed;overflow:hidden;box-shadow:var(--shadow-sm)}
.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#c6a46b}
